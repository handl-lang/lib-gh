# handl manifest for the `lib-gh` repo: the generated `gh` port +
# `gh-cli-host` adapter over lib-cli's `cli-c` (posix_spawnp, no shell).
# The committed source of truth is the spec, `src/gh.clispec.yaml`;
# `generated/` is a gitignored build artifact — regenerate with
#   hnl sdkgen cli src/gh.clispec.yaml --output generated/gh
# (the gate, scripts/hnl-gate.sh, does this first when it is missing).

[dependencies]
cli = { path = "../lib-cli/src/cli" }
cli-c = { path = "../lib-cli/src/cli-c" }
# own modules — the self-referential rows keep name-specs resolving when
# a dependent repo's modules are loaded under this manifest's context
# (same convention as lib-cli/lib-tensor/lib-str-c). They point into
# `generated/`, so run the gate (or sdkgen) once after checkout.
gh = { path = "generated/gh" }
gh-cli-host = { path = "generated/gh-cli-host" }
